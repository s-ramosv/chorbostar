# Easiest path: connect this repo to Netlify, set "Base directory" to `app` (if the repo root is above `app`).
# Or open the `app` folder as the site root in Netlify and this file is picked up automatically.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# chorbostar.com/ → alt (`slides-structure-desktop-alt.json`)
# chorbostar.com/music → original (`slides-structure.json`) — see `desktopPage.js`

[[redirects]]
  from = "/desk-alt"
  to = "/"
  status = 301

[[redirects]]
  from = "/alt"
  to = "/"
  status = 301

# SPA fallback (includes `/music` and client-side paths)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
